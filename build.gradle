plugins {
    id 'java'
}

group = 'vn.haohan'
version = providers.gradleProperty('projectVersion').orElse('1.0.0').get()

repositories {
    mavenCentral()
    maven { name = 'papermc'; url = uri('https://repo.papermc.io/repository/maven-public/') }
    maven { name = 'jitpack'; url = uri('https://jitpack.io') }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:${property('paperVersion')}")
    compileOnly('com.github.Hao-Han-SMP:HaoHanItemCore:a79343279c8aa26749fb05ce5cbef10c430361ac')
    compileOnly('org.xerial:sqlite-jdbc:3.53.2.0')
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filesMatching('paper-plugin.yml') { expand(project: [version: project.version]) }
}

jar { archiveBaseName = project.name }

tasks.register('generateResourcePack', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'vn.haohan.backpack.util.ResourcePackRunner'
}
