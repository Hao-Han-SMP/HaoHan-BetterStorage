title: '&8Ba lô của %player%'
custom-gui:
  enabled: true
  font: 'haohan:gui'
  prefix: "\ue100"
  glyph: "\ue101"
  glyphs:
    1: "\ue102"
    2: "\ue103"
    3: "\ue104"
    4: "\ue105"
    5: "\ue106"
    6: "\ue101"
  glyphs-jukebox:
    2: "\ue113"
    3: "\ue114"
    4: "\ue115"
    6: "\ue117"
  glyphs-furnace:
    2: "\ue123"
    3: "\ue124"
