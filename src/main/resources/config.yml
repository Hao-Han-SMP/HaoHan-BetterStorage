    6: "\ue127"
  glyphs-furnace-jukebox:
    2: "\ue133"
    3: "\ue134"
    4: "\ue135"
    6: "\ue137"
rows: 6
backpack-item-name: 'Backpack'
backpack-item-model: 'haohan:backpack'
backpack-item-lore:
  - '&7Chuột phải để mở ba lô cá nhân.'
  - '&8Dung lượng: 53 ô + 1 module'
database:
  file: backpacks.db
backpack-limit:
  enabled: false
  default: 1
blocked-materials: []
keep-backpacks-after-death: true
block-backpack-in-containers: true
allow-backpacks-inside-backpacks: false
hopper:
  enabled: true
backpack-collision:
  enabled: true
worn-backpack:
  enabled: true
  offset:
    back: 0.26 # Khoảng cách lùi ra sau lưng (block)
    height: 0.75 # Độ cao vị trí đeo sau lưng khi đứng (block)
    sneak-height: 0.70 # Độ cao vị trí đeo sau lưng khi ngồi Shift (block)

magnet:
  enabled: true
  radius: 6.0 # Bán kính hút vật phẩm rơi (block)
  speed: 0.45 # Tốc độ hút vật phẩm
  particles: true # Hiệu ứng hạt khi hút

jukebox:
  enabled: true
  volume: 4.0 # Âm lượng phát nhạc (bán kính phát xung quanh người chơi)
  particles: true # Hiệu ứng nốt nhạc bay xung quanh khi đang phát
